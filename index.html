<html lang="en">

<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
/* Layout: deep-lagoon top bar and nav around a pale sea-glass canvas. White work surfaces, mango for every primary action, tabular figures for money. Bottom tab bar on phones, side rail from 900px. */
:root {
  --bg: #EDF3F1; --surface: #FFFFFF; --sunk: #E3EDEA; --ink: #10292B; --ink2: #4D6668; --line: #D0DEDB;
  --deep: #0A3438; --deep-ink: #E3F3F0; --deep-dim: #8DB8B4; --deep-line: #1D5156;
  --accent: #F4A611; --accent-hi: #FFB92E; --accent-ink: #2B1C00;
  --good: #0F7A58; --good-bg: #D9F2E7; --bad: #B3302A; --bad-bg: #FBE3E0; --warn: #7D5200; --warn-bg: #FFEDC2; --info: #1E5E9C; --info-bg: #DEECFA;
  --bar: #1B7C7A; --bar2: #E0900A; --shadow: 0 1px 2px rgba(10,52,56,.06), 0 8px 24px rgba(10,52,56,.06);
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; --f-body: 'Figtree', 'Segoe UI', system-ui, sans-serif; --f-mono: 'Spline Sans Mono', ui-monospace, Menlo, Consolas, monospace;
  --r: 14px; --gut: max(16px, env(safe-area-inset-left, 0px)); --gutr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #08181A; --surface: #112628; --sunk: #0C1F21; --ink: #E4F0EE; --ink2: #93ADAB; --line: #23403F;
  --deep: #061214; --deep-ink: #DCEEEB; --deep-dim: #7FA6A2; --deep-line: #173B3E;
  --accent: #F5AE1F; --accent-hi: #FFC247; --accent-ink: #2B1C00;
  --good: #55D3A8; --good-bg: #123A2F; --bad: #FF9186; --bad-bg: #40201D; --warn: #F6C86B; --warn-bg: #3B2E0F; --info: #86BAF2; --info-bg: #13293F;
  --bar: #3DB8B0; --bar2: #F5AE1F; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #08181A; --surface: #112628; --sunk: #0C1F21; --ink: #E4F0EE; --ink2: #93ADAB; --line: #23403F;
  --deep: #061214; --deep-ink: #DCEEEB; --deep-dim: #7FA6A2; --deep-line: #173B3E;
  --accent: #F5AE1F; --accent-hi: #FFC247; --accent-ink: #2B1C00;
  --good: #55D3A8; --good-bg: #123A2F; --bad: #FF9186; --bad-bg: #40201D; --warn: #F6C86B; --warn-bg: #3B2E0F; --info: #86BAF2; --info-bg: #13293F;
  --bar: #3DB8B0; --bar2: #F5AE1F; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { font-family: var(--f-body); }
body { background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.45; margin: 0; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--deep); }
body.noscroll { overflow: hidden; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 28px; font-weight: 700; line-height: 1.1; } h2 { font-size: 17px; font-weight: 650; } h3 { font-size: 16px; font-weight: 650; }
p { margin: 0; } small { font-size: 12.5px; color: var(--ink2); } b { font-weight: 650; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.muted { color: var(--ink2); } .neg { color: var(--bad); } .pos { color: var(--good); } .warnt { color: var(--warn); }
body.locked .owner-only { display: none !important; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--deep); color: var(--deep-ink); }
.topbar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px var(--gutr) 10px var(--gut); max-width: 1240px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand > div { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-family: var(--f-display); font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { color: var(--deep-dim); }
.mark { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.mark svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.top-actions { display: flex; gap: 4px; }
.icon-btn { background: transparent; border: 0; width: 40px; height: 40px; border-radius: 10px; display: inline-grid; place-items: center; cursor: pointer; color: inherit; }
.icon-btn:hover { background: var(--sunk); } .icon-btn.lite:hover { background: var(--deep-line); }

/* shell + nav */
.shell { max-width: 1240px; margin: 0 auto; padding: 18px var(--gutr) 120px var(--gut); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; display: flex; background: var(--deep); padding: 6px var(--gutr) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gut); gap: 2px; }
.nav-btn { flex: 1; min-width: 0; position: relative; background: none; border: 0; color: var(--deep-dim); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px; border-radius: 10px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
.nav-btn[aria-current="true"] { background: var(--deep-line); color: var(--accent-hi); }
.dot { position: absolute; top: 3px; left: calc(50% + 6px); background: var(--accent); color: var(--accent-ink); font-style: normal; font-size: 10.5px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 188px minmax(0, 1fr); gap: 28px; padding-bottom: 48px; align-items: start; }
  .nav { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); flex-direction: column; background: transparent; padding: 0; gap: 4px; }
  .nav-btn { flex-direction: row; gap: 12px; padding: 11px 14px; font-size: 15px; color: var(--ink2); }
  .nav-btn[aria-current="true"] { background: var(--deep); color: var(--accent-hi); }
  .dot { position: static; margin-left: auto; }
}
main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }

/* page parts */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.inset { background: var(--sunk); border-color: transparent; padding: 14px; }
.card.narrow { max-width: 420px; margin: 24px auto; display: flex; flex-direction: column; gap: 12px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.card-h.sp { margin-top: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.grid2.top { align-items: start; }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 820px) { .tiles, .tiles.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tl { font-size: 12.5px; color: var(--ink2); font-weight: 600; }
.big { font-family: var(--f-display); font-size: 25px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ts { font-size: 12.5px; color: var(--ink2); }
.quick { display: flex; flex-wrap: wrap; gap: 10px; }
.para { line-height: 1.5; } .para.note { background: var(--sunk); padding: 10px 12px; border-radius: 10px; margin: 8px 0; }
.empty { text-align: center; padding: 26px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ink2); }
.empty b { color: var(--ink); font-family: var(--f-display); font-size: 17px; } .empty p { max-width: 42ch; }
.demo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--info-bg); color: var(--info); border-radius: var(--r); padding: 12px 14px; }
.demo.bad { background: var(--bad-bg); color: var(--bad); }

/* buttons, chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 650; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--ink2); } .btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .btn.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink2); } .btn.ghost:hover { background: var(--sunk); color: var(--ink); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; } .danger-t { color: var(--bad) !important; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; background: var(--sunk); color: var(--ink2); font-size: 12px; font-weight: 650; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); } .chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.info { background: var(--info-bg); color: var(--info); }

/* tabs */
.tabs { display: flex; gap: 6px; }
.tabs.scroll { overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .tabs.scroll::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink2); padding: 7px 14px; border-radius: 99px; font-weight: 650; cursor: pointer; min-height: 38px; }
.tab[aria-pressed="true"] { background: var(--deep); border-color: var(--deep); color: var(--deep-ink); }

/* alerts */
.alert { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; background: var(--sunk); flex-wrap: wrap; }
.alert > span { flex: 1; min-width: 180px; } .alert .btn { margin-left: auto; }
.alert.warn { background: var(--warn-bg); color: var(--warn); } .alert.bad { background: var(--bad-bg); color: var(--bad); } .alert.info { background: var(--info-bg); color: var(--info); }
.alert .btn { background: var(--surface); color: var(--ink); }

/* chart */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; } .chart .ax { fill: var(--ink2); font: 12px var(--f-body); }
.chart .bar { fill: var(--bar); } .chart .gpline { fill: none; stroke: var(--bar2); stroke-width: 2.5; stroke-linejoin: round; } .chart .gpdot { fill: var(--bar2); stroke: var(--surface); stroke-width: 2; }
.legend { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink2); }
.legend .k { width: 10px; height: 10px; border-radius: 3px; display: inline-block; } .legend .k.bar { background: var(--bar); } .legend .k.gp { background: var(--bar2); margin-left: 8px; }

/* order rows */
.orow { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; text-align: left; cursor: pointer; }
.orow:first-of-type { border-top: 0; }
.od { width: 46px; height: 50px; border-radius: 10px; background: var(--sunk); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; line-height: 1.05; }
.od b { font-family: var(--f-display); font-size: 19px; } .od small { text-transform: uppercase; font-size: 10.5px; letter-spacing: .05em; } .od.hot { background: var(--accent); color: var(--accent-ink); } .od.hot small { color: var(--accent-ink); }
.ob { display: flex; flex-direction: column; min-width: 0; flex: 1; } .ob b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ob small { overflow: hidden; text-overflow: ellipsis; }
.or { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }

/* sell */
.sell { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.sell-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cartside { display: none; position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }
@media (min-width: 900px) { .sell { grid-template-columns: minmax(0, 1fr) 340px; } .cartside { display: block; } .cartbar { display: none !important; } }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; min-height: 44px; color: var(--ink2); }
.search input:not([type=radio]):not([type=checkbox]) { border: 0; background: transparent; outline: 0; flex: 1; min-width: 0; color: var(--ink); height: 42px; min-height: 0; padding: 0; border-radius: 0; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.pcard { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; padding: 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); cursor: pointer; min-height: 118px; }
.pcard:hover { border-color: var(--bar); } .pcard:active { transform: scale(.98); }
.pn { font-weight: 650; line-height: 1.2; } .pp { font-family: var(--f-display); font-size: 21px; font-weight: 700; margin-top: auto; font-variant-numeric: tabular-nums; } .pu { font-size: 12px; color: var(--ink2); margin-top: -3px; }
.clines { display: flex; flex-direction: column; } .cline { display: grid; grid-template-columns: 1fr auto 74px; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); } .cline:first-child { border-top: 0; }
.cname { display: flex; flex-direction: column; font-weight: 600; min-width: 0; } .cname small { font-weight: 400; }
.step { display: flex; align-items: center; gap: 4px; } .step button { width: 32px; height: 32px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; } .step b { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.num { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.ctotals { border-top: 2px solid var(--ink); margin-top: 8px; padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.disc { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--ink2); } .disc input { width: 110px; text-align: right; padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); }
.trow { display: flex; justify-content: space-between; align-items: baseline; } .trow.big { font-family: var(--f-display); font-size: 22px; font-weight: 700; } .trow.big b { font-variant-numeric: tabular-nums; }
.paybtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.cartbar { position: fixed; z-index: 34; left: var(--gut); right: var(--gutr); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 0 16px; min-height: 54px; font-weight: 650; box-shadow: 0 8px 24px rgba(0,0,0,.25); cursor: pointer; }
.cartbar b { margin-left: auto; font-family: var(--f-display); font-size: 19px; } .cartbar .go { display: inline-flex; align-items: center; gap: 2px; }

/* forms */
.stack { display: flex; flex-direction: column; gap: 14px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } @media (max-width: 480px) { .two { grid-template-columns: minmax(0, 1fr); } }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; } .lbl { font-size: 13px; font-weight: 650; color: var(--ink2); }
input:not([type=radio]):not([type=checkbox]), select, textarea { width: 100%; min-height: 44px; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--ink); }
textarea { resize: vertical; } textarea.mono { font-family: var(--f-mono); font-size: 12.5px; }
input:focus, select:focus, textarea:focus { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); border-color: var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; } .opt { position: relative; flex: 1 1 auto; } .opt input { position: absolute; opacity: 0; inset: 0; }
.opt span { display: flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 11px; font-weight: 650; background: var(--surface); text-align: center; }
.opt input:checked + span { background: var(--deep); border-color: var(--deep); color: var(--deep-ink); } .opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.chk { display: flex; align-items: center; gap: 10px; } .chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.inl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .inl > input { flex: 1; min-width: 90px; }
.foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; } .foot.start { justify-content: flex-start; } .foot.wrap { flex-wrap: wrap; }
.rows { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; } .rows-list { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.rrow { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, .8fr) minmax(0, .9fr) 40px; gap: 6px; align-items: center; }
.lrow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.4fr) 70px 96px 40px; gap: 6px; align-items: center; }
.lrow [name=ld][hidden] { display: none; } .lrow:has([name=ld][hidden]) { grid-template-columns: minmax(0, 2.7fr) 70px 96px 40px; }
.jrow { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, .8fr) minmax(0, .8fr) minmax(0, 1fr) 40px; gap: 6px; align-items: center; }
@media (max-width: 560px) {
  .lrow, .lrow:has([name=ld][hidden]) { grid-template-columns: 1fr 1fr 40px; } .lrow select, .lrow [name=ld] { grid-column: 1 / 3; } .lrow [name=lq] { grid-column: 1; } .lrow [name=lpr] { grid-column: 2; }
  .jrow { grid-template-columns: 1fr 1fr 40px; } .jrow select, .jrow [name=jp] { grid-column: 1 / 3; }
  .lrow, .jrow { padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
}
.prev { min-width: 0; } .prev:empty { display: none; }
.sum { display: flex; flex-direction: column; gap: 6px; background: var(--sunk); border-radius: 12px; padding: 12px 14px; margin-top: 8px; } .sum > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; } .sum span { color: var(--ink2); } .sum b { font-variant-numeric: tabular-nums; }
.paytotal { display: flex; justify-content: space-between; align-items: baseline; background: var(--sunk); border-radius: 12px; padding: 14px; gap: 10px; } .paytotal b { font-family: var(--f-display); font-size: 28px; }
.change { min-height: 22px; font-size: 15px; }
.quickb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--ink2); font-size: 13px; }
.pbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .pbar select { width: auto; min-width: 160px; } .pbar input { width: auto; }

/* tables */
.tscroll { overflow-x: auto; max-width: 100%; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; } .tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); font-weight: 650; padding: 8px 10px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; } .tbl .r { text-align: right; } .tbl tr:last-child td { border-bottom: 0; }

</div>
<script>
'use strict';
/* ============ helpers ============ */
const KEY = 'kaibar.books.v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((+n + Number.EPSILON) * 100) / 100;
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
function money(n, d = 2) {
  n = +n || 0; if (Math.abs(n) < 0.005) n = 0;
  const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  return (n < 0 ? '−K ' : 'K ') + s;
}
const fmtN = (n, d = 2) => (+n || 0).toLocaleString('en-US', { maximumFractionDigits: d });
const fmtD = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
const fmtDL = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtT = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return ((h + 11) % 12 + 1) + ':' + pad(m) + ' ' + (h < 12 ? 'am' : 'pm'); };
const pct = n => (isFinite(n) ? Math.round(n) : 0) + '%';
const plural = (u, n) => n === 1 ? u : u + (/s$/.test(u) ? '' : 's');
function relDay(s) {
  const d = daysBetween(today(), s);
  if (d === 0) return 'today'; if (d === 1) return 'tomorrow'; if (d === -1) return 'yesterday';
  return d > 0 ? 'in ' + d + ' days' : Math.abs(d) + ' days overdue';
}
function nicePrice(c) { if (c <= 0) return 0; if (c < 2) return Math.ceil(c * 10 - 1e-9) / 10; if (c < 20) return Math.ceil(c * 2 - 1e-9) / 2; return Math.ceil(c - 1e-9); }

/* ============ chart of accounts ============ */
const ACCTS = [
  ['1000', 'Cash on hand', 'A'], ['1010', 'Mobile money', 'A'], ['1100', 'Customers owe me', 'A'],
  ['1200', 'Ingredient stock', 'A'], ['1210', 'Food ready to sell', 'A'], ['1300', 'Equipment & fittings', 'A'],
  ['2000', 'I owe suppliers', 'L'], ['2100', 'Customer deposits', 'L'],
  ['3000', 'Owner capital', 'Q'], ['3100', 'Owner drawings', 'Q'],
  ['4000', 'Counter sales', 'R'], ['4100', 'Cake order sales', 'R'], ['4200', 'Catering sales', 'R'],
  ['4800', 'Forfeited deposits', 'R'], ['4900', 'Discounts given', 'R'],
  ['5000', 'Cost of food sold', 'X'], ['5100', 'Waste & staff meals', 'X'],
  ['6000', 'Wages', 'X'], ['6100', 'Rent', 'X'], ['6200', 'Gas, firewood & power', 'X'], ['6300', 'Packaging & cleaning', 'X'],
  ['6400', 'Transport', 'X'], ['6500', 'Phone & airtime', 'X'], ['6600', 'Repairs', 'X'], ['6900', 'Other expenses', 'X'], ['6950', 'Cash over / short', 'X']
];
const TYPE_NAME = { A: 'Assets', L: 'Liabilities', Q: 'Owner equity', R: 'Income', X: 'Expenses' };
const EXP_CHOICES = ['6000', '6100', '6200', '6300', '6400', '6500', '6600', '6900', '1300'];
const acctName = a => (ACCTS.find(x => x[0] === a) || [0, a])[1];
const acctType = a => (ACCTS.find(x => x[0] === a) || [0, 0, 'X'])[2];

/* ============ state ============ */
let S = null;
let storageOK = true;
const blank = () => ({ v: 1, biz: 'My Kaibar', pin: '', demo: false, target: 40, ings: [], prods: [], entries: [], orders: [], closes: [], seq: 0, onum: 0 });
function load() { try { const t = localStorage.getItem(KEY); if (t) return JSON.parse(t); } catch (e) { storageOK = false; } return null; }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; } }
const ing = id => S.ings.find(i => i.id === id);
const prod = id => S.prods.find(p => p.id === id);
const ord = id => S.orders.find(o => o.id === id);

/* ============ units ============ */
const FAM = { w: { base: 'g', units: ['kg', 'g'], label: 'Weight (kg, g)' }, v: { base: 'ml', units: ['L', 'ml', 'cup', 'tbsp', 'tsp'], label: 'Liquid (L, ml)' }, c: { base: 'pc', units: ['pc', 'dozen'], label: 'Count (pieces)' } };
const UM = { kg: 1000, g: 1, L: 1000, ml: 1, cup: 250, tbsp: 15, tsp: 5, pc: 1, dozen: 12 };
const unitsFor = i => { const u = [...FAM[i.fam].units]; if (i.custom && i.custom.name) u.push(i.custom.name); return u; };
const unitMult = (i, u) => (i.custom && u === i.custom.name) ? i.custom.base : (UM[u] || 1);
const toBase = (i, q, u) => q * unitMult(i, u);
const fromBase = (i, b, u) => b / unitMult(i, u);
const ucost = i => (i.qty > 1e-9 && i.value > 0) ? i.value / i.qty : (i.lastCost || 0);
const unitOpts = (i, sel) => unitsFor(i).map(u => `<option ${u === sel ? 'selected' : ''}>${esc(u)}</option>`).join('');
const stockLabel = i => fmtN(fromBase(i, i.qty, i.unit)) + ' ' + i.unit;

/* ============ recipe costing ============ */
function recipeCalc(p, units) {
  const f = units / (p.yield || 1); const lines = []; let ingCost = 0;
  for (const l of (p.recipe || [])) {
    const i = ing(l.ing); if (!i) continue;
    const q = toBase(i, l.q, l.u) * f; const c = r2(q * ucost(i));
    lines.push({ id: i.id, name: i.name, q, c, short: i.qty < q - 1e-9, i, disp: fromBase(i, q, l.u), u: l.u });
    ingCost += c;
  }
  ingCost = r2(ingCost); const over = r2((p.over || 0) * f);
  return { lines, ingCost, over, total: r2(ingCost + over), per: units ? (ingCost + over) / units : 0, f };
}
const recipeUnitCost = p => p.kind === 'resell' ? (p.lastCost || 0) : recipeCalc(p, p.yield || 1).per;
const ucostP = p => (p.pqty > 1e-9 && p.pvalue > 0) ? p.pvalue / p.pqty : (p.lastCost || recipeUnitCost(p));
const marginOf = (price, cost) => price > 0 ? (price - cost) / price * 100 : 0;

/* ============ ledger ============ */
function post({ date, memo, type, lines, ev, ref }) {
  lines = lines.filter(l => (l.dr || 0) || (l.cr || 0)).map(l => ({ a: l.a, dr: r2(l.dr || 0), cr: r2(l.cr || 0), party: l.party || '' }));
  const dr = r2(lines.reduce((s, l) => s + l.dr, 0)), cr = r2(lines.reduce((s, l) => s + l.cr, 0));
  if (Math.abs(dr - cr) > 0.004) throw new Error('Entry does not balance: ' + memo + ' ' + dr + ' vs ' + cr);
  const e = { id: uid(), n: ++S.seq, date: date || today(), ts: Date.now(), memo, type, lines, ev: ev || null, ref: ref || null };
  S.entries.push(e); return e;
}
function netByAcct(from = '0000-00-00', to = '9999-99-99') {
  const m = {};
  for (const e of S.entries) { if (e.date < from || e.date > to) continue; for (const l of e.lines) m[l.a] = r2((m[l.a] || 0) + l.dr - l.cr); }
  return m;
}
const nat = (a, net) => (acctType(a) === 'A' || acctType(a) === 'X') ? net : -net;
const balOf = a => nat(a, netByAcct()[a] || 0);
function partyBalances(a) {
  const m = {};
  for (const e of S.entries) for (const l of e.lines) if (l.a === a && l.party) m[l.party] = r2((m[l.party] || 0) + (a === '1100' ? l.dr - l.cr : l.cr - l.dr));
  return Object.entries(m).filter(([, v]) => Math.abs(v) > 0.004).map(([party, amt]) => ({ party, amt })).sort((x, y) => y.amt - x.amt);
}
const payAcct = m => m === 'cash' ? '1000' : m === 'mobile' ? '1010' : '2000';
const rcvAcct = m => m === 'cash' ? '1000' : m === 'mobile' ? '1010' : '1100';

/* ============ engine: stock ============ */
function buyIng({ id, q, u, cost, method, supplier, date }) {
  const i = ing(id), base = toBase(i, q, u); cost = r2(cost);
  i.qty += base; i.value = r2(i.value + cost); i.lastCost = cost / base;
  return post({ date, memo: `Bought ${fmtN(q)} ${u} ${i.name}` + (supplier ? ' · ' + supplier : ''), type: 'purchase',
    lines: [{ a: '1200', dr: cost }, { a: payAcct(method), cr: cost, party: method === 'credit' ? supplier : '' }], ev: { kind: 'buy', id, base, cost } });
}
function cook({ pid, units, date }) {
  const p = prod(pid), c = recipeCalc(p, units); const used = [];
  for (const l of c.lines) { l.i.qty -= l.q; l.i.value = r2(l.i.value - l.c); used.push({ id: l.id, q: l.q, c: l.c }); }
  p.pqty += units; p.pvalue = r2(p.pvalue + c.total); p.lastCost = c.total / units;
  return post({ date, memo: `Cooked ${fmtN(units)} ${plural(p.unit, units)} ${p.name}`, type: 'cook',
    lines: [{ a: '1210', dr: c.total }, { a: '1200', cr: c.ingCost }, { a: '6200', cr: c.over }],
    ev: { kind: 'cook', pid, units, ing: used, total: c.total, over: c.over, ingCost: c.ingCost } });
}
function stockIn({ pid, units, cost, method, supplier, date }) {
  const p = prod(pid); cost = r2(cost);
  p.pqty += units; p.pvalue = r2(p.pvalue + cost); p.lastCost = cost / units;
  return post({ date, memo: `Bought ${fmtN(units)} ${plural(p.unit, units)} ${p.name} to resell` + (supplier ? ' · ' + supplier : ''), type: 'stockin',
    lines: [{ a: '1210', dr: cost }, { a: payAcct(method), cr: cost, party: method === 'credit' ? supplier : '' }], ev: { kind: 'stockin', pid, units, cost } });
}
function writeOff({ t, id, q, reason, date }) { // t: 'p' product units, 'i' ingredient display qty in base
  let c, name, memo;
  if (t === 'p') { const p = prod(id); c = r2(ucostP(p) * q); p.pqty -= q; p.pvalue = r2(p.pvalue - c); name = p.name; memo = `${reason}: ${fmtN(q)} ${plural(p.unit, q)} ${name}`; }
  else { const i = ing(id); c = r2(ucost(i) * q); i.qty -= q; i.value = r2(i.value - c); name = i.name; memo = `${reason}: ${fmtN(fromBase(i, q, i.unit))} ${i.unit} ${name}`; }
  return post({ date, memo, type: 'waste', lines: [{ a: '5100', dr: c }, { a: t === 'p' ? '1210' : '1200', cr: c }], ev: { kind: 'waste', t, id, q, c, reason, name } });
}

/* ============ engine: sales & money ============ */
function sell({ lines, method, customer, ref, discount, date, tendered }) {
  let sub = 0, cogs = 0; const L = [];
  for (const l of lines) {
    const p = prod(l.pid), price = l.price ?? p.price, c = r2(ucostP(p) * l.qty);
    sub += price * l.qty; cogs += c; L.push({ pid: p.id, name: p.name, cat: p.cat, qty: l.qty, price, cost: c });
  }
  sub = r2(sub); cogs = r2(cogs); const disc = r2(Math.min(discount || 0, sub)), total = r2(sub - disc);
  const e = post({ date, memo: 'Sale' + (customer ? ' · ' + customer : ''), type: 'sale',
    lines: [{ a: rcvAcct(method), dr: total, party: method === 'credit' ? customer : '' }, { a: '4900', dr: disc }, { a: '4000', cr: sub }, { a: '5000', dr: cogs }, { a: '1210', cr: cogs }],
    ev: { kind: 'sale', lines: L, method, customer, ref, disc, total, tendered } });
  L.forEach(l => { const p = prod(l.pid); p.pqty -= l.qty; p.pvalue = r2(p.pvalue - l.cost); });
  return e;
}
function spend({ acct, amount, desc, method, supplier, date }) {
  amount = r2(amount);
  return post({ date, memo: desc || acctName(acct), type: 'expense', lines: [{ a: acct, dr: amount }, { a: payAcct(method), cr: amount, party: method === 'credit' ? supplier : '' }] });
}
function paySupplier({ party, amount, method, date }) {
  return post({ date, memo: 'Paid supplier · ' + party, type: 'payment', lines: [{ a: '2000', dr: amount, party }, { a: payAcct(method), cr: amount }] });
}
function collectFrom({ party, amount, method, date }) {
  return post({ date, memo: 'Payment received · ' + party, type: 'receipt', lines: [{ a: rcvAcct(method), dr: amount }, { a: '1100', cr: amount, party }] });
}
function ownerMoney({ kind, amount, method, memo, date }) {
  return kind === 'in'
    ? post({ date, memo: memo || 'Owner put money in', type: 'owner', lines: [{ a: rcvAcct(method), dr: amount }, { a: '3000', cr: amount }] })
    : post({ date, memo: memo || 'Owner took money out', type: 'owner', lines: [{ a: '3100', dr: amount }, { a: rcvAcct(method), cr: amount }] });
}
function countCash({ counted, date }) {
  const exp = balOf('1000'), diff = r2(counted - exp); let e = null;
  if (Math.abs(diff) >= 0.005) e = post({ date, memo: 'Cash count difference', type: 'count', lines: diff > 0 ? [{ a: '1000', dr: diff }, { a: '6950', cr: diff }] : [{ a: '6950', dr: -diff }, { a: '1000', cr: -diff }] });
  S.closes.push({ id: uid(), date, expected: exp, counted, diff, eid: e && e.id });
  return diff;
}

/* ============ engine: orders ============ */
const ORDER_FLOW = ['booked', 'kitchen', 'ready', 'delivered'];
const ORDER_LABEL = { booked: 'Booked', kitchen: 'In the kitchen', ready: 'Ready', delivered: 'Delivered', cancelled: 'Cancelled' };
const orderTotal = o => r2(o.lines.reduce((s, l) => s + l.qty * l.price, 0));
const orderPaid = o => r2(o.payments.reduce((s, p) => s + p.amt, 0));
function orderCost(o) {
  let ingC = 0, prodC = 0;
  for (const b of o.bom || []) { const i = ing(b.ing); if (i) ingC += toBase(i, b.q, b.u) * ucost(i); }
  for (const l of o.lines) if (l.pid) { const p = prod(l.pid); if (p) prodC += ucostP(p) * l.qty; }

function niceMax(v) { const e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e; }
function chart(days, showGP = true) {
  const W = 520, H = 230, L = 52, R = 8, T = 14, B = 34, iw = W - L - R, ih = H - T - B;
  const mx = niceMax(Math.max(1, ...days.map(d => d.rev), ...(showGP ? days.map(d => d.gp) : [0])));
  const bw = iw / days.length, Y = v => T + ih * (1 - Math.max(0, v) / mx);
  const ticks = [0, mx / 2, mx].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" class="ax">${v >= 1000 ? fmtN(v / 1000, 1) + 'k' : fmtN(v)}</text>`).join('');
  const step = days.length > 16 ? 5 : days.length > 8 ? 2 : 1;
  const bars = days.map((d, i) => {
    const x = L + i * bw + bw * .16, w = bw * .68, y = Y(d.rev), h = T + ih - y;
    const lbl = i % step === 0 || i === days.length - 1 ? `<text x="${L + i * bw + bw / 2}" y="${H - 12}" text-anchor="middle" class="ax">${d.d.slice(8)}</text>` : '';
    return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0, h)}" rx="3" class="bar"><title>${fmtD(d.d)}: sales ${money(d.rev)}</title></rect>${lbl}`;
  }).join('');
  const pts = days.map((d, i) => [L + i * bw + bw / 2, Y(d.gp)]);
  const gp = showGP ? `<g class="owner-only"><polyline points="${pts.map(p => p.join(',')).join(' ')}" class="gpline"/>${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 3}" class="gpdot"><title>${fmtD(days[i].d)}: profit ${money(days[i].gp)}</title></circle>`).join('')}</g>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily sales and profit">${ticks}${bars}${gp}</svg>`;
}

};
